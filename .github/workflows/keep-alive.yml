# Keeps the Supabase free tier from pausing the demo.
#
# Free projects pause after seven consecutive days with no database activity, and a paused
# project accepts no connections. Without this, a link sent in a proposal is dead by the time
# someone clicks it the following week.
#
# Runs daily rather than weekly on purpose: a weekly job that fails once puts the project inside
# the pause window with no second chance.
#
# Set KEEP_ALIVE_URL as a repository variable (Settings → Secrets and variables → Actions →
# Variables) to https://your-deployment.vercel.app/api/health
name: Keep alive

on:
  schedule:
    # 07:14 UTC. An odd minute rather than the hour, because GitHub's scheduler queues heavily
    # on the hour and jobs can be delayed or dropped.
    - cron: '14 7 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the health endpoint
        run: |
          if [ -z "${{ vars.KEEP_ALIVE_URL }}" ]; then
            echo "KEEP_ALIVE_URL is not set. Add it under Settings → Secrets and variables → Actions → Variables."
            exit 1
          fi

          # --fail turns a 4xx/5xx into a non-zero exit, so a broken deployment shows as a failed
          # workflow rather than a green tick over a dead site.
          response=$(curl --silent --show-error --fail --max-time 30 "${{ vars.KEEP_ALIVE_URL }}")
          echo "$response"

          echo "$response" | grep -q '"ok":true' || {
            echo "Health check responded but reported a problem."
            exit 1
          }
