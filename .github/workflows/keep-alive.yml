# Backup keep-alive. The primary is the Vercel cron in vercel.json.
#
# Supabase pauses free projects after seven consecutive days without database activity, and a
# paused project accepts no connections — a link in a proposal is dead by the time someone
# clicks it the following week.
#
# Two independent pingers, because one is not a plan. A GitHub account can be locked over
# billing (which is exactly what happened here), and a Vercel deployment can be paused; both
# failing in the same week is unlikely, and either alone is enough.
#
# Disabled until KEEP_ALIVE_URL is set, so it does not fail noisily while the Vercel cron is
# doing the work. To enable: Settings -> Secrets and variables -> Actions -> Variables ->
# KEEP_ALIVE_URL = https://your-deployment.vercel.app/api/health
name: Keep alive (backup)

on:
  schedule:
    # 19:14 UTC — twelve hours offset from the Vercel cron, so a bad day needs both to fail.
    - cron: '14 19 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the health endpoint
        run: |
          if [ -z "${{ vars.KEEP_ALIVE_URL }}" ]; then
            echo "KEEP_ALIVE_URL is not set — skipping. The Vercel cron is the primary."
            exit 0
          fi

          response=$(curl --silent --show-error --fail --max-time 30 "${{ vars.KEEP_ALIVE_URL }}")
          echo "$response"

          echo "$response" | grep -q '"ok":true' || {
            echo "Health check responded but reported a problem."
            exit 1
          }
